source /boot/grub/config.cfg

# Entradas propias en lugar de las genéricas de live-build ("Live system").
menuentry "G-Mini OS" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "G-Mini OS (English)" --hotkey=e {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=en_US.UTF-8 keyboard-layouts=us,latam
	initrd	@INITRD_LIVE@
}

menuentry "G-Mini OS (modo seguro: gráficos básicos)" {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

submenu 'Utilidades' --hotkey=u {

	source /boot/grub/theme.cfg

	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "Configuración del firmware UEFI" --hotkey=f {
			fwsetup
		}
	fi

	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verificar el medio de arranque" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
