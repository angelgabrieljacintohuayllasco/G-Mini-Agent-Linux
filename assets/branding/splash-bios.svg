<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <title>G-Mini OS: fondo del menú de arranque BIOS (SYSLINUX)</title>
  <!-- SYSLINUX exige 640x480. El menú se dibuja desde la fila 10 (y = 160). -->
  <defs>
    <radialGradient id="bg" cx="320" cy="90" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16244a"/>
      <stop offset="0.55" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#0b1220"/>
    </radialGradient>
    <linearGradient id="ring" x1="44" y1="36" x2="214" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86a4ff"/>
      <stop offset="0.5" stop-color="#4d7cff"/>
      <stop offset="1" stop-color="#2f4fd1"/>
    </linearGradient>
    <radialGradient id="core" cx="128" cy="128" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#d6e1ff"/>
      <stop offset="1" stop-color="#6f95ff"/>
    </radialGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <g transform="translate(284 22) scale(0.28125)">
    <path d="M 90 206 L 40 238 L 52 170 Z" fill="url(#ring)"/>
    <path d="M 184.6 71.4 A 80 80 0 1 0 208 128 L 174 128" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="128" cy="128" r="21" fill="url(#core)"/>
  </g>
  <text x="320" y="126" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="22" font-weight="600" fill="#e6ebff" letter-spacing="0.5">G-Mini OS</text>
  <line x1="200" y1="142" x2="440" y2="142" stroke="#4d7cff" stroke-opacity="0.35" stroke-width="1"/>
</svg>
