LABEL gmini
TEXT HELP
Starts G-Mini OS live in Spanish (Peru) with a Latin American keyboard.
ENDTEXT
MENU LABEL G-Mini OS
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=70% copytoram=n quiet loglevel=3

LABEL gmini_en
TEXT HELP
Starts G-Mini OS live in English with a US keyboard.
ENDTEXT
MENU LABEL G-Mini OS (English)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=70% copytoram=n quiet loglevel=3 gmini.lang=en

LABEL gmini_safe
TEXT HELP
Basic graphics (nomodeset), for video cards that show a black screen.
ENDTEXT
MENU LABEL G-Mini OS (modo seguro / safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=70% copytoram=n nomodeset
