<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>G-Mini OS</title>
  <defs>
    <radialGradient id="bg" cx="1380" cy="420" r="1250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17264d"/>
      <stop offset="0.45" stop-color="#0f1a35"/>
      <stop offset="1" stop-color="#0b1220"/>
    </radialGradient>
    <linearGradient id="arcLocal" x1="-440" y1="-420" x2="460" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86a4ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2f4fd1" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="core" cx="1420" cy="540" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4d7cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4d7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="44" y1="36" x2="214" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86a4ff"/>
      <stop offset="0.5" stop-color="#4d7cff"/>
      <stop offset="1" stop-color="#2f4fd1"/>
    </linearGradient>
    <radialGradient id="dot" cx="128" cy="128" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#d6e1ff"/>
      <stop offset="1" stop-color="#6f95ff"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- La G del logo en gran formato, casi transparente, hacia la derecha -->
  <g transform="translate(1420 540)">
    <path d="M 296.2 -296.2 A 418.9 418.9 0 1 0 418.9 0 L 240 0" fill="none" stroke="url(#arcLocal)" stroke-width="118" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="560" fill="none" stroke="#4d7cff" stroke-opacity="0.07" stroke-width="2"/>
    <circle r="690" fill="none" stroke="#4d7cff" stroke-opacity="0.045" stroke-width="2"/>
  </g>
  <circle cx="1420" cy="540" r="160" fill="url(#core)"/>
  <circle cx="1420" cy="540" r="34" fill="#cfdcff" fill-opacity="0.16"/>

  <!-- Marca discreta abajo a la izquierda -->
  <g transform="translate(96 924) scale(0.25)">
    <path d="M 90 206 L 40 238 L 52 170 Z" fill="url(#ring)"/>
    <path d="M 184.6 71.4 A 80 80 0 1 0 208 128 L 174 128" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="128" cy="128" r="21" fill="url(#dot)"/>
  </g>
  <text x="172" y="966" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="30" font-weight="600" fill="#e6ebff" fill-opacity="0.92" letter-spacing="0.5">G-Mini OS</text>
  <text x="172" y="996" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="17" fill="#8a97c2" letter-spacing="0.3">Agente de IA de escritorio</text>
</svg>
