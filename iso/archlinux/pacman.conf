#
# pacman.conf del build de la ISO (no se copia al sistema live).
# scripts/build-iso-arch.sh añade al final el repositorio local [gmini] con el
# paquete g-mini-agent-bin construido desde el AppImage de la release.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
