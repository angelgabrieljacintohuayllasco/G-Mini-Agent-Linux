# SYSLINUX dibuja el texto con la fuente de la BIOS (CP437): sin tildes.
menu clear
menu background splash.png
menu color title	* #ffe6ebff #00000000 none
menu color border	* #00000000 #00000000 none
menu color sel		* #ffffffff #ff4d7cff none
menu color hotsel	1;7;37;40 #ffffffff #ff4d7cff none
menu color unsel	* #ffa9b5d9 #00000000 none
menu color hotkey	* #ff86a4ff #00000000 none
menu color tabmsg	* #ff6b7aa6 #00000000 none
menu color timeout_msg	* #ff8a97c2 #00000000 none
menu color timeout	* #ffe6ebff #00000000 none
menu color help		37;40 #ffc8d3f5 #00000000 none
menu vshift 10
menu rows 9
menu helpmsgrow 21
# La línea de comandos debe quedar al menos una fila por encima del final.
menu cmdlinerow 23
menu timeoutrow 23
menu tabmsgrow 25
menu tabmsg Enter: iniciar / boot    Tab: editar / edit
