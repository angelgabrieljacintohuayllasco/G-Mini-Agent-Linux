# El menu tambien sale por el puerto serie (pruebas con QEMU y servidores).
SERIAL 0 115200
UI vesamenu.c32
MENU TITLE G-Mini OS
MENU BACKGROUND splash.png

# SYSLINUX dibuja el texto con la fuente de la BIOS (CP437): sin tildes.
MENU WIDTH 64
MENU MARGIN 8
MENU ROWS 9
MENU VSHIFT 10
MENU TABMSGROW 22
MENU CMDLINEROW 22
MENU HELPMSGROW 24
MENU HELPMSGENDROW 29

# https://wiki.syslinux.org/wiki/index.php/Comboot/menu.c32
MENU COLOR border       30;44   #00000000 #00000000 none
MENU COLOR title        1;36;44 #ffe6ebff #00000000 none
MENU COLOR sel          7;37;40 #ffffffff #ff4d7cff none
MENU COLOR unsel        37;44   #ffa9b5d9 #00000000 none
MENU COLOR help         37;40   #ffc8d3f5 #00000000 none
MENU COLOR timeout_msg  37;40   #ff8a97c2 #00000000 none
MENU COLOR timeout      1;37;40 #ffe6ebff #00000000 none
MENU COLOR msg07        37;40   #ffa9b5d9 #00000000 none
MENU COLOR tabmsg       31;40   #ff6b7aa6 #00000000 none

MENU CLEAR
MENU IMMEDIATE
