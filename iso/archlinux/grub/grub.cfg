# GRUB de G-Mini OS para arranque UEFI (basado en releng de archiso).

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Modo gráfico con el tema de G-Mini OS. Si no hay fuente, menú de texto.
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    insmod gfxterm
    insmod png
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
    set theme="/boot/grub/themes/gmini/theme.txt"
fi

# El menú también sale por el puerto serie (pruebas con QEMU y servidores).
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

set default=gmini
set timeout=10
set timeout_style=menu

# Parámetros comunes: cowspace grande para la preparación del primer arranque
# de G-Mini Agent (unos 1,5 GB) y sin copytoram para no gastar RAM en la imagen.
set gmini_params="archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=70% copytoram=n"
export gmini_params

menuentry "G-Mini OS" --class arch --class gnu-linux --class gnu --class os --id 'gmini' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux ${gmini_params} quiet loglevel=3
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "G-Mini OS (English)" --class arch --class gnu-linux --class gnu --class os --id 'gmini-en' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux ${gmini_params} quiet loglevel=3 gmini.lang=en
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "G-Mini OS (modo seguro: gráficos básicos)" --class arch --class gnu-linux --class gnu --class os --id 'gmini-safe' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux ${gmini_params} nomodeset
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Memtest86+ (prueba de RAM)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'Configuración del firmware UEFI' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Apagar' --class shutdown --class poweroff {
    halt
}

menuentry 'Reiniciar' --class reboot --class restart {
    reboot
}
