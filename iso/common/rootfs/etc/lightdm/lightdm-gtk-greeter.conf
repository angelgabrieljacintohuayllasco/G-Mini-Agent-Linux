# Pantalla de acceso de G-Mini OS (en la sesión live entra sola; se ve al
# cerrar sesión o en un sistema instalado).
[greeter]
background=/usr/share/backgrounds/g-mini/g-mini-os-1920x1080.png
theme-name=Adwaita-dark
icon-theme-name=Papirus-Dark
font-name=Noto Sans 11
default-user-image=#avatar-default-symbolic
indicators=~host;~spacer;~clock;~spacer;~layout;~language;~session;~a11y;~power
clock-format=%H:%M
position=50%,center 50%,center
