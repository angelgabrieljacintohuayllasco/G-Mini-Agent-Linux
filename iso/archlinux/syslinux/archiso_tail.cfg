LABEL existing
TEXT HELP
Boots an operating system that is already installed on the first disk.
ENDTEXT
MENU LABEL Iniciar el sistema instalado / Boot existing OS
COM32 chain.c32
APPEND hd0 0

# https://www.memtest.org/
LABEL memtest
MENU LABEL Memtest86+ (RAM)
LINUX /boot/memtest86+/memtest

# https://wiki.syslinux.org/wiki/index.php/Hdt_(Hardware_Detection_Tool)
LABEL hdt
MENU LABEL Hardware (HDT)
COM32 hdt.c32
APPEND modules_alias=hdt/modalias.gz pciids=hdt/pciids.gz

LABEL reboot
MENU LABEL Reiniciar / Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Apagar / Power off
COM32 poweroff.c32
